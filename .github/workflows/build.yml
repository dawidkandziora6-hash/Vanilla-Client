name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: logbuch-mod
          path: build/libs/*.jar
      - name: Release "neueste Version" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste -y --cleanup-tag || true
          gh release create neueste build/libs/*.jar \
            --title "Logbuch – neueste Version (MC 26.3)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Jar zusammen mit Fabric Loader ≥ 0.19.5 und Fabric API 0.161.0+26.3 in den mods-Ordner legen." \
            --latest
