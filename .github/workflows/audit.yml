name: audit
on: workflow_dispatch

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
      - name: Start client and apply all mixins
        run: |
          chmod +x gradlew
          set +e
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Paudit --no-daemon > audit.log 2>&1
          echo "exit=$?" >> audit.log
      - name: Publish log
        if: always()
        run: |
          mkdir -p out
          cp audit.log out/ || true
          cp run/logs/latest.log out/ || true
          cp run/screenshots/*.png out/ || true
          ls -la out run/screenshots || true
          cd out && git init -q && git checkout -q -b audit-log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "audit" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" audit-log
