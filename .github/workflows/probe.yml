name: probe
on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Prepare Minecraft
        run: chmod +x gradlew && ./gradlew compileJava --no-daemon -q || true
      - name: Probe
        run: bash tools/probe.sh
      - name: Publish probe output
        run: |
          cd probe
          git init -q && git checkout -q -b probe-out
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "probe" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
