plugins {
	// Ab Minecraft 26.1 ist das Spiel nicht mehr obfuskiert: kein Remapping, keine Mappings.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// CI-only: `./gradlew runClient -Paudit` force-applies all mixins once and exits.
if (project.hasProperty('audit')) {
	loom {
		runs {
			client {
				vmArg "-Dvanillaclient.audit=true"
				vmArg "-Dmixin.debug.verbose=true"
			}
		}
	}
}

// CI-only: `./gradlew runClientGameTest -Pworldtest` loads a real world and takes screenshots.
if (project.hasProperty('worldtest')) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "vanillaclient-worldtest"
			enableGameTests = false
			enableClientGameTests = true
			eula = true
		}
	}
}
